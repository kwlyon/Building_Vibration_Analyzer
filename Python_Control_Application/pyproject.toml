[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "building-vibration-analyzer"
version = "0.2.0"
description = "Windows control and analysis application for the Teensy ADXL355 building vibration logger"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.3",
  "scipy==1.16.2",
  "matplotlib==3.10.7",
  "pyserial==3.5",
  "PySide6==6.10.1",
]

[project.scripts]
building-vibration-analyzer = "building_vibration_analyzer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
